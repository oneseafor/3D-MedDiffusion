# ============================================================
# 3D-MedDiffusion Cardiac Multi-Modal Pipeline Configuration
# ============================================================
# 分模态训练：Cine模型和LGE模型分别训练
# - Cine模型: 处理 cine4ch + cinesax (D=25)
# - LGE模型: 处理 lgesax (D=6)
# ============================================================

# --- Data Source ---
data:
  root_dir: "/home/zirui/yuansq/CMR-AI/0_data_CMRAI"

  # Modality mapping (directory prefix -> config key)
  modality_mapping:
    cine4ch: "0_final_custom_cine4ch"
    cinesax: "0_final_custom_cinesax"
    lgesax:  "0_final_custom_lgesax"

  # Disease categories
  disease_categories:
    - "ARVC_niigz"
    - "RCM_niigz"
    - "DCM_niigz"
    - "HCM_niigz"
    - "LVNC_niigz"

  # NIfTI file naming
  file_naming:
    cine4ch: ["cine_4ch_mid.nii.gz"]
    cinesax: ["cine_sax_down.nii.gz", "cine_sax_mid.nii.gz", "cine_sax_up.nii.gz"]
    lgesax:  ["lge_sax_mid6.nii.gz"]

  # Cinesax slice alignment (3 slices: down/mid/up)
  slice_alignment:
    strategy: "mid_only"

# --- Model Architecture ---
model:
  # Cine 模型 (cine4ch + cinesax, D=25)
  cine:
    autoencoder:
      downsample: [8, 8, 8]
      in_channels: 1
      out_channels: 1
      n_hiddens: 48
      embedding_dim: 8
      n_codes: 8192
      patch_size: 128
      patch_depth: 25        # 完整25帧
      n_groups: 24
    diffusion:
      image_size: [16, 16, 25]
      in_channels: 8
      model_channels: 128
      out_channels: 8
      num_res_blocks: 2
      attention_resolutions: [4, 2, 1]
      num_heads: 4
      num_classes: 5
      class_names: ["ARVC", "DCM", "HCM", "LVNC", "RCM"]

  # LGE 模型 (lgesax, D=6)
  lge:
    autoencoder:
      downsample: [8, 8, 1]   # D维度不下采样
      in_channels: 1
      out_channels: 1
      n_hiddens: 48
      embedding_dim: 8
      n_codes: 8192
      patch_size: 128
      patch_depth: 6           # 完整6帧
      n_groups: 24
    diffusion:
      image_size: [16, 16, 6]
      in_channels: 8
      model_channels: 128
      out_channels: 8
      num_res_blocks: 2
      attention_resolutions: [4, 2, 1]
      num_heads: 4
      num_classes: 5
      class_names: ["ARVC", "DCM", "HCM", "LVNC", "RCM"]

# --- Training ---
training:
  # Cine 模型训练参数
  cine:
    batch_size: 4            # D=25 较大
    learning_rate: 1.0e-4
    num_epochs: 100
    num_workers: 4
    precision: "16"
    gradient_clip_val: 1.0
    autoencoder:
      stage1_epochs: 50
      stage2_epochs: 20
      disc_start: 5000
      perceptual_weight: 2.0
      l1_weight: 4.0
      gan_weight: 2.0
    diffusion:
      timesteps: 1000
      beta_schedule: "cosine"
      loss_type: "l2"
      ema_decay: 0.995

  # LGE 模型训练参数
  lge:
    batch_size: 16           # D=6 较小
    learning_rate: 1.0e-4
    num_epochs: 100
    num_workers: 4
    precision: "16"
    gradient_clip_val: 1.0
    autoencoder:
      stage1_epochs: 50
      stage2_epochs: 20
      disc_start: 5000
      perceptual_weight: 2.0
      l1_weight: 4.0
      gan_weight: 2.0
    diffusion:
      timesteps: 1000
      beta_schedule: "cosine"
      loss_type: "l2"
      ema_decay: 0.995

# --- Generation / Export ---
generation:
  output_root: "/home/kangchang.shen/out_put/3D-MedDiffusion/synthetic_data"
  target_diseases: ["RCM_niigz", "ARVC_niigz"]
  num_patients_per_disease: 3
  patient_id_prefix: "generated_patient_id"
  patient_id_start: 1
  center_name: "synthetic_center_batch"
  modalities_to_generate:
    - "cine4ch"
    - "cinesax"
    - "lgesax"

  # Output volume dimensions
  # 生成时输出单帧/单层
  volume_sizes:
    cine4ch: [256, 256, 1]
    cinesax: [256, 256, 1]
    lgesax:  [256, 256, 1]

  # Output file naming
  output_file_naming:
    cine4ch:
      - "cine_4ch_mid.nii.gz"
    cinesax:
      - "cine_sax_down.nii.gz"
      - "cine_sax_mid.nii.gz"
      - "cine_sax_up.nii.gz"
    lgesax:
      - "lge_sax_mid1.nii.gz"
      - "lge_sax_mid2.nii.gz"
      - "lge_sax_mid3.nii.gz"
      - "lge_sax_mid4.nii.gz"
      - "lge_sax_mid5.nii.gz"
      - "lge_sax_mid6.nii.gz"

  # Sampling parameters
  sampling:
    strategy: "ddim"
    ddim_steps: 50
    eta: 0.0

# --- Logging ---
logging:
  log_dir: "/home/kangchang.shen/out_put/3D-MedDiffusion/logs"
  save_checkpoints: true
  checkpoint_dir: "/home/kangchang.shen/out_put/3D-MedDiffusion/checkpoints"
  log_interval: 10
